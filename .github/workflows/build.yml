name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags="-s -w" -o qalqon.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: qalqon-windows-amd64
          path: qalqon.exe
